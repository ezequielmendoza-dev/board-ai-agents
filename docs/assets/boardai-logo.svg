<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="skyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="260" height="260" rx="36" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- ==================== BOARDAI CIRCUIT / PATCHBAY MARK ==================== -->
  <g transform="translate(10, 10)">
    <!-- Board Pins / Edge Connectors (Top & Bottom) -->
    <line x1="85" y1="24" x2="85" y2="34" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="120" y1="20" x2="120" y2="34" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#skyGlow)"/>
    <line x1="155" y1="24" x2="155" y2="34" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <line x1="85" y1="206" x2="85" y2="216" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="120" y1="206" x2="120" y2="220" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#skyGlow)"/>
    <line x1="155" y1="206" x2="155" y2="216" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Outer Board Frame -->
    <rect x="34" y="34" width="172" height="172" rx="26" fill="url(#boardGrad)" stroke="#38bdf8" stroke-width="3.5" filter="url(#skyGlow)"/>
    <!-- Inner Board Frame -->
    <rect x="44" y="44" width="152" height="152" rx="18" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.8"/>

    <!-- DAG Signal Routing Traces (Sky Blue) -->
    <polyline points="74,76 58,120 74,164" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <polyline points="166,76 182,120 166,164" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <line x1="120" y1="76" x2="120" y2="106" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="120" y1="134" x2="120" y2="164" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Top Bus (Double Line) -->
    <line x1="74" y1="73" x2="166" y2="73" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <line x1="74" y1="79" x2="166" y2="79" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

    <!-- Middle Bus (Double Line with Center Core Gap) -->
    <line x1="58" y1="116" x2="104" y2="116" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="124" x2="104" y2="124" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <line x1="136" y1="116" x2="182" y2="116" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <line x1="136" y1="124" x2="182" y2="124" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

    <!-- Bottom Bus (Double Line) -->
    <line x1="74" y1="161" x2="166" y2="161" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <line x1="74" y1="167" x2="166" y2="167" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

    <!-- Stage Nodes (Emerald) -->
    <circle cx="74" cy="76" r="7.5" fill="#34d399" stroke="#065f46" stroke-width="2"/>
    <circle cx="166" cy="76" r="7.5" fill="#34d399" stroke="#065f46" stroke-width="2"/>
    <circle cx="58" cy="120" r="7.5" fill="#34d399" stroke="#065f46" stroke-width="2"/>
    <circle cx="182" cy="120" r="7.5" fill="#34d399" stroke="#065f46" stroke-width="2"/>
    <circle cx="74" cy="164" r="7.5" fill="#34d399" stroke="#065f46" stroke-width="2"/>
    <circle cx="166" cy="164" r="7.5" fill="#34d399" stroke="#065f46" stroke-width="2"/>

    <!-- Center Memory Core Diamond -->
    <polygon points="120,107 133,120 120,133 107,120" fill="url(#purpleGrad)" stroke="#e9d5ff" stroke-width="1.5" filter="url(#purpleGlow)"/>
  </g>
</svg>
